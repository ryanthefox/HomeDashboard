services:
  dashboard:
    build: .
    restart: unless-stopped
    # Host-netwerk: nodig zodat Wake-on-LAN-broadcasts je LAN bereiken.
    # Het dashboard blijft gewoon op poort 5000 bereikbaar.
    network_mode: host
    # Schijven van de server alleen-lezen meekijken (ook je datadisks onder /srv),
    # zodat de systeem-widget de echte schijven en vrije ruimte toont.
    volumes:
      - /:/hostfs:ro,rslave
    environment:
      - HOST_ROOT=/hostfs
      # Hue
      - HueBridge__BridgeIp=${HUE_BRIDGE_IP}
      - HueBridge__ApiKey=${HUE_API_KEY}
      # LG ThinQ
      - LgThinq__PersonalAccessToken=${LGTHINQ_PAT}
      - LgThinq__ClientId=${LGTHINQ_CLIENT_ID}
      - LgThinq__CountryCode=${LGTHINQ_COUNTRY:-NL}
      - LgThinq__BaseUrl=${LGTHINQ_BASE_URL:-https://api-eic.lgthinq.com}
      # Weather (optioneel — defaults zijn Veenendaal)
      - Weather__Latitude=${WEATHER_LAT:-52.0259}
      - Weather__Longitude=${WEATHER_LON:-5.5553}
      - Weather__Timezone=${WEATHER_TZ:-Europe/Amsterdam}
      # Plex (draait Plex op dezelfde machine, laat de default staan)
      - Plex__ServerUrl=${PLEX_SERVER_URL:-http://localhost:32400}
      - Plex__Token=${PLEX_TOKEN}
      # Afvalkalender: standaard het meegeleverde HomeDashboard.Api/data/afval.ics, of een iCal-link
      - Afval__ICalUrl=${AFVAL_ICAL_URL:-data/afval.ics}
      # PC: stats + aan/uit (zie HomeDashboard.Agent/install-agent.ps1)
      - Pc__Name=${PC_NAME:-PC}
      - Pc__AgentUrl=${PC_AGENT_URL}
      - Pc__AgentKey=${PC_AGENT_KEY}
      - Pc__MacAddress=${PC_MAC}
      - Pc__BroadcastAddress=${PC_BROADCAST:-255.255.255.255}
      - Pc__MediaUrl=${PC_MEDIA_URL:-}
